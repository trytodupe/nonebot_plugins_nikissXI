[project]
name = "nonebot_plugin_eop_ai"
version = "0.3.5"
description = "Nonebot2 一款调用eop api的AI聊天插件"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "aiohttp>=3.11.0",
    "mdx-breakless-lists>=1.0.1",
    "mdx-truly-sane-lists>=1.3",
    "nonebot-adapter-onebot>=2.0.0",
    "nonebot-plugin-htmlrender>=0.2.1",
    "nonebot2>=2.0.0rc1",
]
authors = [
    {name = "nikissXI", email = "1299577815@qq.com"},
]
license = {text = "MIT"}

[project.urls]
Homepage = "https://github.com/nikissXI/nonebot_plugins/tree/main/nonebot_plugin_eop_ai"
Repository = "https://github.com/nikissXI/nonebot_plugins/tree/main/nonebot_plugin_eop_ai"
Documentation = "https://github.com/nikissXI/nonebot_plugins/tree/main/nonebot_plugin_eop_ai#README.md"

[[tool.uv.index]]
url = "https://mirrors.tuna.tsinghua.edu.cn/pypi/web/simple"
default = true

[tool.setuptools.packages.find]
include = ["nonebot_plugin_eop_ai"]

[build-system]
requires = ["setuptools>=65.5", "wheel"]
build-backend = "setuptools.build_meta"
